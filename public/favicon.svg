<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" /> <!-- Purple 600 -->
      <stop offset="100%" style="stop-color:#D8B4FE;stop-opacity:1" /> <!-- Purple 300 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#9333EA" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle/rect can be omitted for a transparent browser icon, but the shapes are purple -->
  <path d="M120 380 L256 120 L392 380" fill="none" stroke="url(#gradBrand)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M160 300 L352 300" fill="none" stroke="#D8B4FE" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Diamond / upward arrow in the center or above? The letter A is already an upward arrow -->
  <path d="M256 120 L256 40" fill="none" stroke="url(#gradBrand)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>